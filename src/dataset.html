<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Demo</title>
    <script src="./js/dataset.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #items {
            list-style: none;
            padding: 0;
        }
        #items li {
            padding: 10px;
            margin: 5px 0;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #items li:hover {
            background-color: #02b0d2;
            color: white;
        }
        #details {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-left: 4px solid #02b0d2;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Click on an item to see details</h1>
    
    <ul id="items">
        <li data-name="banana" data-category="fruit" data-color="yellow">🍌 Banana</li>
        <li data-name="carrot" data-category="vegetable" data-color="orange">🥕 Carrot</li>
        <li data-name="blueberry" data-category="fruit" data-color="blue">🫐 Blueberry</li>
    </ul>
</body>
</html>
